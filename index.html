<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Web App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b0f14;color:#fff}
header{padding:20px;text-align:center;border-bottom:1px solid #202733}
h1{margin:0 0 15px;font-size:25px}
.search{display:flex;max-width:700px;margin:auto;gap:8px}
.search input{flex:1;padding:14px;border-radius:12px;border:1px solid #303947;background:#151b24;color:#fff;font-size:16px}
button{border:0;border-radius:11px;padding:12px 18px;background:#2563eb;color:#fff;cursor:pointer;font-weight:bold}
main{max-width:1100px;margin:25px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#121821;border:1px solid #222b38;border-radius:16px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card-body{padding:13px}
.title{font-weight:bold;line-height:1.5}
.channel{color:#9ca7b5;margin-top:8px;font-size:13px}
.empty{text-align:center;color:#8993a1;padding:50px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5;padding:18px;overflow:auto}
.modal-box{max-width:900px;margin:30px auto;background:#111820;border-radius:18px;padding:18px}
.close{float:left;background:#333}
video{width:100%;max-height:65vh;background:#000;border-radius:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
select{background:#18202b;color:#fff;border:1px solid #303947;padding:11px;border-radius:10px}
.note{font-size:12px;color:#929dac;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>مشغل الفيديو</h1>
<div class="search">
<input id="q" placeholder="ابحث عن فيديو...">
<button onclick="searchVideos()">بحث</button>
</div>
</header>

<main>
<div id="results" class="grid"></div>
<div id="empty" class="empty">ابحث عن فيديو للبدء</div>
</main>

<div id="modal" class="modal">
<div class="modal-box">
<button class="close" onclick="closePlayer()">إغلاق</button>
<h2 id="videoTitle"></h2>
<video id="player" controls playsinline></video>
<div class="controls">
<select id="quality" onchange="changeQuality()"></select>
<button onclick="startDownload('video')">تحميل فيديو</button>
<button onclick="startDownload('audio')">تحميل صوت</button>
</div>
<div class="note">روابط البث المباشر مؤقتة ويتم استخراجها عند الطلب.</div>
</div>
</div>

<script>
let currentVideo=null;
let videoData=null;

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function searchVideos(){
 const q=document.getElementById("q").value.trim();
 if(!q)return;
 const results=document.getElementById("results");
 const empty=document.getElementById("empty");
 empty.textContent="جاري البحث...";
 empty.style.display="block";
 results.innerHTML="";
 try{
   const r=await fetch("/api/search?q="+encodeURIComponent(q));
   const data=await r.json();
   if(data.error)throw new Error(data.error);
   empty.style.display=data.items.length?"none":"block";
   if(!data.items.length){empty.textContent="لم يتم العثور على نتائج";return;}
   results.innerHTML=data.items.map(v=>`
    <div class="card" onclick="playVideo('${esc(v.id)}')">
      <img src="${esc(v.thumbnail)}" loading="lazy">
      <div class="card-body">
        <div class="title">${esc(v.title)}</div>
        <div class="channel">${esc(v.channel)}</div>
      </div>
    </div>`).join("");
 }catch(e){
   empty.textContent="حدث خطأ: "+e.message;
 }
}

async function playVideo(id){
 currentVideo=id;
 const modal=document.getElementById("modal");
 const player=document.getElementById("player");
 const quality=document.getElementById("quality");
 document.getElementById("videoTitle").textContent="جاري التحميل...";
 modal.style.display="block";
 try{
   const r=await fetch("/api/video/"+encodeURIComponent(id));
   videoData=await r.json();
   if(videoData.error)throw new Error(videoData.error);
   document.getElementById("videoTitle").textContent=videoData.title||"الفيديو";
   quality.innerHTML="";
   const seen=new Set();
   (videoData.formats||[]).slice().reverse().forEach(f=>{
     if(!f.quality||seen.has(f.quality))return;
     seen.add(f.quality);
     const o=document.createElement("option");
     o.value=f.url;
     o.textContent=f.quality+"p"+(f.has_audio?"":" (فيديو فقط)");
     quality.appendChild(o);
   });
   player.src=videoData.stream_url||"";
   if(player.src)player.play().catch(()=>{});
 }catch(e){
   document.getElementById("videoTitle").textContent="تعذر تشغيل الفيديو";
   alert(e.message);
 }
}

function changeQuality(){
 const url=document.getElementById("quality").value;
 if(url)document.getElementById("player").src=url;
}

async function startDownload(type){
 if(!currentVideo)return;
 try{
   const r=await fetch(`/api/download/${encodeURIComponent(currentVideo)}?type=${type}`);
   const data=await r.json();
   if(data.error)throw new Error(data.error);
   if(!data.download_url)throw new Error("لم يتم الحصول على رابط التحميل");
   window.open(data.download_url,"_blank");
 }catch(e){
   alert("تعذر التحميل: "+e.message);
 }
}

function closePlayer(){
 document.getElementById("player").pause();
 document.getElementById("player").src="";
 document.getElementById("modal").style.display="none";
}

document.getElementById("q").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchVideos();
});
</script>
</body>
</html>
